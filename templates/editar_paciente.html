<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar paciente - SIGAE WEB</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <aside class="sidebar">
        <h2>SIGAE WEB</h2>
        <p>Sistema de atendimento</p>

        <nav>
            <a href="/">Início</a>
            <a href="/pacientes" class="ativo">Pacientes</a>
            <a href="/triagem">Triagem</a>
            <a href="/medicos">Médicos</a>
            <a href="/atendimentos">Atendimentos</a>
            <a href="/historico">Histórico</a>
        </nav>
    </aside>

    <main class="conteudo">
        <header>
            <h1>Editar paciente</h1>
            <p>Atualização dos dados cadastrais</p>
        </header>

        <section class="painel">

            {% if mensagem %}
                <p class="mensagem-erro">{{ mensagem }}</p>
            {% endif %}

            <form method="POST">

                <label for="id">ID do paciente</label>
                <input type="number" id="id"
                       value="{{ paciente[0] }}" readonly>

                <label for="nome">Nome completo</label>
                <input type="text" id="nome" name="nome"
                       value="{{ paciente[1] }}" required>

                <button type="submit" class="btn-principal">
                    Salvar alterações
                </button>

                <a href="{{ url_for('pacientes') }}" class="btn-cancelar">
                    Cancelar
                </a>

            </form>
        </section>
    </main>

</body>
</html>
